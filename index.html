<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK-PAPER-SCISSOR</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Rock Paper Scissor</h1>
    </header>

    <main>
        <section>
            <h2>Choose Your Weapon</h2>

            <div class="buttons">
                <button>ROCK</button>
                <button>PAPER</button>
                <button>SCISSORS</button>
            </div>
        </section>

        <section>
            <h2>Result!</h2>
            <p>You Win</p>
        </section>

        <section>
            <h2>Score</h2>
            <p>You: 0</p>
            <p>Computer: 0</p>
        </section>
    </main>
</body>
</html>
